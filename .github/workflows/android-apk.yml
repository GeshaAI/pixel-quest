name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['index.html', 'assets/**', 'android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Ensure Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, sign and verify offline APK
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PixelQuest-v0.9.0-Android
          path: build/android/dist/*
          if-no-files-found: error
          retention-days: 30
