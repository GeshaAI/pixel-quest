<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#15263b"><title>PIXEL QUEST</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#101b2d;color:white;font-family:monospace;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;top:8px;left:12px;text-shadow:2px 2px #000;font-weight:bold;font-size:16px}#pause{position:fixed;top:8px;right:12px}button{border:2px solid #fff8;background:#14253abb;color:white;border-radius:12px;font:bold 22px monospace;touch-action:none;user-select:none;-webkit-user-select:none}#controls{position:fixed;bottom:15px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:12px;pointer-events:auto}.ctrl{width:72px;height:72px}#overlay{position:fixed;inset:0;background:#071324d9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center}#overlay h1{font-size:clamp(30px,7vw,64px);color:#ffd56a;text-shadow:4px 4px #a04450;margin:0}#overlay button{padding:12px 25px}#overlay p{max-width:420px;line-height:1.5}@media(max-height:500px){#overlay{gap:6px;padding:10px;overflow:auto;justify-content:flex-start}#overlay h1{font-size:30px}#overlay p{margin:4px}#overlay button{font-size:18px;padding:7px 18px}.ctrl{width:60px;height:60px}}</style>
<canvas id="game"></canvas><div id="hud"></div><button id="pause">Ⅱ</button><div id="controls"><div class="cluster"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="cluster"><button class="ctrl" data-key="run">⚡</button><button class="ctrl" data-key="jump">▲</button></div></div><div id="overlay"><h1>PIXEL QUEST</h1><p>Explore the Emerald Hills. Collect gems, dodge critters and reach the golden gate!</p><button id="start">NEW GAME</button><button id="continue">CONTINUE</button><button id="levels">LEVEL SELECT</button><button id="settings">SETTINGS</button><button id="home" style="display:none">MAIN MENU</button><p>Keyboard: arrows / A D, Space to jump, Shift to run, P to pause.</p></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),cont=document.querySelector('#continue');
const W=480,H=270,T=24,worldW=130*T;let scale=1,cam=0,state='menu',score=0,coins=0,lives=3,tick=0,checkpoint=2*T;
const keys={left:false,right:false,jump:false,run:false};let jumpBuffer=0,coyote=0,wasJump=false;
let solids=[],gems=[],enemies=[],particles=[],flags=[],player;let crates=[],powerups=[];let elapsed=0,level=1;let checkpointState=null;let facing=1;const VERSION='0.4.1';let audio=null,sound=true;
function readStore(k){try{return localStorage.getItem(k)}catch{return null}}
sound=readStore('pq_sound')!=='off';
function tone(freq,duration=.08){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,audio.currentTime+duration);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function resize(){c.width=Math.max(1,innerWidth*Math.min(2,devicePixelRatio));c.height=Math.max(1,innerHeight*Math.min(2,devicePixelRatio));scale=Math.min(c.width/W,c.height/H);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function block(x,y,w=1,h=1,type='earth'){solids.push({x:x*T,y:y*T,w:w*T,h:h*T,type})}
function build(){solids=[];gems=[];enemies=[];particles=[];flags=[];crates=[];powerups=[];for(let x=0;x<130;x++){if(level===1?((x>=24&&x<=27)||(x>=54&&x<=57)||(x>=88&&x<=91)):((x>=19&&x<=21)||(x>=43&&x<=46)||(x>=70&&x<=73)||(x>=101&&x<=104)))continue;block(x,10,1,3)}(level===1?[[8,7,4],[18,6,4],[31,7,5],[44,6,4],[61,7,5],[76,6,5],[96,7,5],[112,6,5]]:[[7,7,4],[24,6,4],[36,7,3],[51,6,5],[64,7,4],[79,6,4],[91,7,5],[109,6,4],[119,7,3]]).forEach(([x,y,w])=>block(x,y,w,1,'brick'));[5,7,9,12,15,20,22,30,33,36,40,45,48,52,60,64,69,73,78,82,86,95,99,104,109,115,120,124].forEach((x,i)=>gems.push({x:x*T+8,y:(i%3===0?6:8)*T,got:false}));(level===1?[14,34,46,68,80,100,116]:[12,28,39,53,62,82,95,111,121]).forEach((x,i)=>enemies.push({x:x*T,y:10*T-17,w:19,h:17,vx:i%2?35:-35,alive:true}));crates=(level===1?[16,41,72,110]:[10,33,58,88,115]).map((x,i)=>({x:x*T,y:(i%2?6:7)*T,used:false,w:T,h:T}));powerups=(level===1?[{x:38*T,y:8*T,type:'heart',got:false},{x:84*T,y:8*T,type:'speed',got:false}]:[{x:49*T,y:8*T,type:'speed',got:false},{x:99*T,y:8*T,type:'heart',got:false}]);flags=[{x:127*T,y:6*T}];checkpoint=2*T;player={x:checkpoint,y:6*T,w:17,h:22,vx:0,vy:0,onGround:false,inv:0,boost:0};cam=0;tick=0;elapsed=0;jumpBuffer=coyote=0;checkpointState=null}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function collide(axis){
for(const list of [solids,crates])for(const b of list){
if(!intersects(player,b))continue;
if(axis==='x'){if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0}
else{if(player.vy>0){player.y=b.y-player.h;player.onGround=true}
else if(player.vy<0){player.y=b.y+b.h;if(list===crates&&!b.used){b.used=true;score+=50;gems.push({x:b.x+8,y:b.y-24,got:false});for(let i=0;i<8;i++)particles.push({x:b.x+12,y:b.y+12,vx:(Math.random()-.5)*120,vy:-Math.random()*130,life:.6});tone(650)}}player.vy=0}}
}
function snapshot(){return {score,coins,gems:gems.map(g=>({...g})),crates:crates.map(q=>q.used),powerups:powerups.map(p=>p.got),enemies:enemies.map(e=>({x:e.x,vx:e.vx,alive:e.alive}))}}
function restore(d){if(!d||!Array.isArray(d.gems))return;score=Math.max(0,d.score|0);coins=Math.max(0,d.coins|0);gems=d.gems.filter(g=>Number.isFinite(g.x)&&Number.isFinite(g.y)).map(g=>({...g}));crates.forEach((q,i)=>q.used=!!d.crates?.[i]);powerups.forEach((p,i)=>p.got=!!d.powerups?.[i]);enemies.forEach((e,i)=>{const v=d.enemies?.[i];if(v&&Number.isFinite(v.x)&&Number.isFinite(v.vx)){e.x=v.x;e.vx=v.vx;e.alive=!!v.alive}})}
function hurt(){if(player.inv>0)return;lives--;tone(130,.25);if(lives<=0){state='lost';try{localStorage.removeItem('pq_save')}catch(e){}show('GAME OVER','RETRY');return}restore(checkpointState);player.x=checkpoint;player.y=5*T;player.vx=player.vy=0;player.inv=1.5;save()}
function show(title,button){overlay.style.display='flex';overlay.querySelector('h1').textContent=title;start.textContent=button;cont.style.display='none';document.querySelector('#home').style.display='block';document.querySelector('#levels').style.display='none';document.querySelector('#settings').style.display='none'}
function begin(resume=false,selected=1){let saved=null;if(resume){try{saved=JSON.parse(readStore('pq_save')||'null')}catch{}}level=resume?(saved?.level===2?2:1):selected;build();score=0;coins=0;lives=3;if(resume){try{const d=JSON.parse(readStore('pq_save')||'null');if(d&&Number.isFinite(d.x)&&d.x>=0&&d.x<worldW){player.x=d.x;player.y=5*T;checkpoint=d.x;score=Math.max(0,d.score|0);coins=Math.max(0,d.coins|0);lives=Math.max(1,Math.min(5,d.lives|0));restore(d.snapshot)}}catch(e){}}checkpointState=snapshot();resetInput();cam=Math.max(0,Math.min(worldW-W,player.x-W*.38));state='play';overlay.style.display='none';save();tone(480)}
start.onclick=()=>{if(state==='paused'||state==='between'){state='play';overlay.style.display='none';resetInput()}else begin(false)};cont.onclick=()=>begin(true);cont.style.display=readStore('pq_save')?'block':'none';
function menu(){resetInput();state='menu';show('PIXEL QUEST','NEW GAME');cont.style.display=readStore('pq_save')?'block':'none';document.querySelector('#home').style.display='none';document.querySelector('#levels').style.display='block';document.querySelector('#settings').style.display='block';overlay.querySelector('p').textContent='Emerald Hills • 2 playable levels • v'+VERSION}
document.querySelector('#home').onclick=menu;document.querySelector('#levels').onclick=()=>{show('LEVEL SELECT','PLAY 1-1');overlay.querySelector('p').textContent='Emerald Hills → Dusk Trail. Complete 1-1 to reach 1-2.'};document.querySelector('#settings').onclick=()=>{sound=!sound;try{localStorage.setItem('pq_sound',sound?'on':'off')}catch{}document.querySelector('#settings').textContent='SOUND: '+(sound?'ON':'OFF');tone(500)};
const sources={left:new Set(),right:new Set(),jump:new Set(),run:new Set()};
function resetInput(){for(const k of Object.keys(keys)){keys[k]=false;sources[k].clear()}jumpBuffer=0}
function input(k,id,down){if(down)sources[k].add(id);else sources[k].delete(id);setKey(k,sources[k].size>0)}
function setKey(k,v){if(k==='jump'&&v&&!keys.jump)jumpBuffer=.13;keys[k]=v}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(k,e.pointerId,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>input(k,e.pointerId,false))});
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'run',ShiftRight:'run'};
addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();input(map[e.code],e.code,true)}if(e.code==='KeyP'&&!e.repeat)pause()});addEventListener('keyup',e=>{if(map[e.code]){e.preventDefault();input(map[e.code],e.code,false)}});addEventListener('blur',()=>{resetInput();if(state==='play')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
function pause(){resetInput();if(state==='play'){state='paused';show('PAUSED','RESUME')}else if(state==='paused'){state='play';overlay.style.display='none'}}
document.querySelector('#pause').onclick=pause;
function save(){try{localStorage.setItem('pq_save',JSON.stringify({version:VERSION,level,x:checkpoint,score,coins,lives,snapshot:checkpointState}))}catch(e){}}function step(dt){tick+=dt;elapsed+=dt;player.inv=Math.max(0,player.inv-dt);player.boost=Math.max(0,player.boost-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);coyote=player.onGround?.095:Math.max(0,coyote-dt);
const dir=(keys.right?1:0)-(keys.left?1:0);if(dir)facing=dir;const speed=player.boost>0?240:(keys.run?190:135),acc=player.onGround?1100:700;player.vx+=Math.max(-acc*dt,Math.min(acc*dt,dir*speed-player.vx));if(!dir)player.vx*=Math.max(0,1-(player.onGround?12:3)*dt);
if(jumpBuffer>0&&coyote>0){tone(420);player.vy=-305;player.onGround=false;coyote=0;jumpBuffer=0}
if(!keys.jump&&player.vy<0)player.vy+=1100*dt;
player.vy=Math.min(520,player.vy+850*dt);player.x+=player.vx*dt;collide('x');player.y+=player.vy*dt;player.onGround=false;collide('y');player.x=Math.max(0,Math.min(worldW-player.w,player.x));
if(player.y>H+140){hurt();return}
for(const p of powerups){if(!p.got&&Math.abs(player.x-p.x)<20&&Math.abs(player.y-p.y)<24){p.got=true;if(p.type==='heart')lives=Math.min(5,lives+1);else player.boost=10;score+=250}}for(const g of gems){if(!g.got&&Math.abs(player.x-g.x)<19&&Math.abs(player.y-g.y)<23){g.got=true;tone(880);coins++;score+=100;for(let i=0;i<7;i++)particles.push({x:g.x,y:g.y,vx:(Math.random()-.5)*100,vy:-Math.random()*100,life:.5})}}
for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*dt;const probe={x:e.vx>0?e.x+e.w+1:e.x-2,y:e.y+e.h+2,w:2,h:3};if(solids.some(b=>intersects(e,b))||!solids.some(b=>intersects(probe,b))){e.x-=e.vx*dt;e.vx=-e.vx}if(intersects(player,e)){if(player.vy>40&&player.y+player.h-e.y<15){e.alive=false;tone(220);player.vy=-220;score+=200}else{hurt();return}}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(player.x>63*T&&checkpoint<60*T){checkpoint=60*T;checkpointState=snapshot();tone(720,.18);save()}if(player.x>105*T&&checkpoint<95*T){checkpoint=95*T;checkpointState=snapshot();tone(720,.18);save()}
if(state==='play'&&player.x>flags[0].x-10){if(level===1){level=2;build();checkpointState=snapshot();save();resetInput();show('LEVEL 1 COMPLETE!','NEXT LEVEL');state='between';return}state='won';try{localStorage.removeItem('pq_save')}catch(e){}try{localStorage.setItem('pq_unlocked','1');localStorage.setItem('pq_score',score);localStorage.setItem('pq_coins',coins)}catch{}tone(960,.3);show('WORLD COMPLETE!','PLAY AGAIN')}
cam+=((Math.max(0,Math.min(worldW-W,player.x-W*.38)))-cam)*Math.min(1,dt*7);hud.textContent='★ '+score+'   ◆ '+coins+'   ♥ '+lives+'   1-'+level+'   v'+VERSION}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#142137';ctx.fillRect(0,0,c.width,c.height);ctx.setTransform(scale,0,0,scale,(c.width-W*scale)/2,(c.height-H*scale)/2);
rect(0,0,W,H,level===1?'#77c8ef':'#435a91');rect(0,190,W,80,level===1?'#b5e7f1':'#62739a');
for(let i=0;i<12;i++){let x=((i*115-cam*.22)%(W+140)+(W+140))%(W+140)-70;rect(x,100+(i%3)*14,80,100,level===1?'#68bdb2':'#536a82');rect(x+16,78+(i%3)*14,50,28,level===1?'#68bdb2':'#536a82')}
ctx.save();ctx.translate(-Math.round(cam),0);
for(const b of solids){if(b.x+b.w<cam-30||b.x>cam+W+30)continue;rect(b.x,b.y,b.w,b.h,b.type==='brick'?'#b96b52':(level===1?'#9b603f':'#565e75'));rect(b.x,b.y,b.w,5,b.type==='brick'?'#e8b17d':(level===1?'#69c35d':'#b8d7e4'));if(b.type==='brick')for(let x=b.x+12;x<b.x+b.w;x+=24)rect(x,b.y+12,2,10,'#713f44')}
for(const q of crates){if(q.x<cam-30||q.x>cam+W+30)continue;rect(q.x,q.y,T,T,q.used?'#786a71':'#e0a044');rect(q.x+5,q.y+5,14,14,q.used?'#968b88':'#ffda75');if(!q.used)rect(q.x+10,q.y+7,5,10,'#98613e')}for(const p of powerups){if(p.got||p.x<cam-30||p.x>cam+W+30)continue;rect(p.x,p.y,16,16,p.type==='heart'?'#e95474':'#5b80f5');rect(p.x+5,p.y+4,6,8,'#fff4c4')}for(const g of gems){if(g.got||g.x<cam-20||g.x>cam+W+20)continue;let bob=Math.sin(tick*6+g.x)*3;rect(g.x+4,g.y+bob,10,14,'#ffde61');rect(g.x+7,g.y+3+bob,4,8,'#fff5b0')}
for(const e of enemies){if(!e.alive||e.x<cam-30||e.x>cam+W+30)continue;rect(e.x,e.y+5,19,12,'#a54879');rect(e.x+3,e.y,13,8,'#e2779a');rect(e.x+4,e.y+7,3,4,'#fff');rect(e.x+12,e.y+7,3,4,'#fff')}
for(const cp of [60*T,95*T]){rect(cp,8*T,3,2*T,'#e4e6d0');rect(cp+3,8*T,16,10,checkpoint>=cp?'#ffd75e':'#589dae')}
for(const f of flags){rect(f.x,f.y,4,96,'#eee4c7');rect(f.x+4,f.y,28,18,'#ffce4c');rect(f.x+11,f.y+4,12,8,'#b66b45')}
if(!(player.inv>0&&Math.floor(tick*12)%2)){let x=player.x,y=player.y;const stride=player.onGround&&Math.abs(player.vx)>15?Math.sin(tick*22)*2:0;y+=player.onGround?Math.abs(stride)*.4:0;rect(x+3,y,11,6,'#353d79');rect(x+1,y+5,15,9,'#f4bf8b');rect(x+3,y+14,12,8,'#2b5c83');rect(x+(facing>0?12:3),y+8,3,3,'#233344');rect(x+2+stride,y+20,6,3,'#503b59');rect(x+10-stride,y+20,6,3,'#503b59');rect(x+1,y+13,3,7,'#e5a05e')}
for(const p of particles)rect(p.x,p.y,3,3,'#ffdf69');ctx.restore();
if(state==='paused')rect(0,0,W,H,'rgba(0,0,0,.32)')}
let prev=0,acc=0;function frame(ms){const dt=Math.min(.05,(ms-prev)/1000||0);prev=ms;if(state==='play'){acc+=dt;let n=0;while(acc>=1/120&&n++<8){step(1/120);acc-=1/120;if(state!=='play'){acc=0;break}}}else acc=0;draw();requestAnimationFrame(frame)}build();menu();requestAnimationFrame(frame);
})();
</script></html>
