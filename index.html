<script>
(()=>{'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),cont=document.querySelector('#continue');
const W=480,H=270,T=24,worldW=130*T;let scale=1,cam=0,state='menu',score=0,coins=0,lives=3,tick=0,checkpoint=2*T;
const keys={left:false,right:false,jump:false,run:false,action:false};let jumpBuffer=0,coyote=0,wasJump=false,actionBuffer=0;let movingPlatforms=[],riding=null,portals=[],room='main',roomReturn=null,secretLoot=0,secretHeart=false;
let solids=[],gems=[],enemies=[],particles=[],flags=[],player;let crates=[],powerups=[];let elapsed=0,level=1;let checkpointState=null;let facing=1;const VERSION='0.8.0';let audio=null,sound=true;
function readStore(k){try{return localStorage.getItem(k)}catch{return null}}
sound=readStore('pq_sound')!=='off';
function tone(freq,duration=.08){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,audio.currentTime+duration);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function resize(){c.width=Math.max(1,innerWidth*Math.min(2,devicePixelRatio));c.height=Math.max(1,innerHeight*Math.min(2,devicePixelRatio));scale=Math.min(c.width/W,c.height/H);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function block(x,y,w=1,h=1,type='earth'){solids.push({x:x*T,y:y*T,w:w*T,h:h*T,type})}
function build(){room='main';roomReturn=null;movingPlatforms=[];riding=null;portals=[];secretLoot=0;secretHeart=false;actionBuffer=0;solids=[];gems=[];enemies=[];particles=[];flags=[];crates=[];powerups=[];for(let x=0;x<130;x++){if(level===1?((x>=24&&x<=27)||(x>=54&&x<=57)||(x>=88&&x<=91)):((x>=19&&x<=21)||(x>=43&&x<=46)||(x>=70&&x<=73)||(x>=101&&x<=104)))continue;block(x,10,1,3)}(level===1?[[8,7,4],[18,6,4],[31,7,5],[44,6,4],[61,7,5],[76,6,5],[96,7,5],[112,6,5]]:[[7,7,4],[24,6,4],[36,7,3],[51,6,5],[64,7,4],[79,6,4],[91,7,5],[109,6,4],[119,7,3]]).forEach(([x,y,w])=>block(x,y,w,1,'brick'));[5,7,9,12,15,20,22,30,33,36,40,45,48,52,60,64,69,73,78,82,86,95,99,104,109,115,120,124].forEach((x,i)=>gems.push({x:x*T+8,y:(i%3===0?6:8)*T,got:false}));(level===1?[14,34,46,68,80,100,116]:[12,28,39,53,62,82,95,111,121]).forEach((x,i)=>enemies.push({x:x*T,y:10*T-17,w:19,h:17,vx:i%2?35:-35,alive:true}));crates=(level===1?[16,41,72,110]:[10,33,58,88,115]).map((x,i)=>({x:x*T,y:(i%2?6:7)*T,used:false,w:T,h:T}));powerups=(level===1?[{x:38*T,y:8*T,type:'heart',got:false},{x:84*T,y:8*T,type:'speed',got:false}]:[{x:49*T,y:8*T,type:'speed',got:false},{x:99*T,y:8*T,type:'heart',got:false}]);flags=[{x:127*T,y:6*T}];checkpoint=2*T;player={x:checkpoint,y:6*T,w:17,h:22,vx:0,vy:0,onGround:false,inv:0,boost:0};cam=0;tick=0;elapsed=0;jumpBuffer=coyote=0;checkpointState=null;if(level===3)configureCavern()}
function configureCavern(){solids=[];gems=[];enemies=[];crates=[];powerups=[];for(let x=0;x<130;x++){if([[21,26],[49,55],[80,86],[108,111]].some(([a,b])=>x>=a&&x<=b))continue;block(x,10,1,3,'cave')}
[[7,8,3],[10,7,3],[30,8,3],[39,8,4],[61,9,2],[63,8,2],[65,7,4],[91,8,4],[114,8,4]].forEach(([x,y,w])=>block(x,y,w,1,'brick'));
[5,8,11,16,19,29,32,37,42,46,58,62,65,68,73,77,90,94,99,103,106,114,118,123].forEach((x,i)=>gems.push({x:x*T+8,y:(i%4===1?7:8)*T,got:false}));
[12,36,59,75,96,118].forEach((x,i)=>enemies.push({x:x*T,y:10*T-17,w:19,h:17,vx:i%2?35:-35,alive:true,type:'beetle'}));
[16,45,72,101,121].forEach((x,i)=>enemies.push({type:'bat',x:x*T,y:196,w:22,h:12,vx:i%2?-38:38,alive:true,baseY:196,minX:(x-2)*T,maxX:(x+2)*T,phase:i*1.7}));
crates=[17,44,102,120].map(x=>({x:x*T,y:8*T,used:false,w:T,h:T}));powerups=[{x:33*T,y:8*T,type:'speed',got:false},{x:93*T,y:8*T,type:'heart',got:false}];
movingPlatforms=[[21,24,9,3,2.8],[49,53,9,3,3.6],[80,84,9,3,3.2]].map(([a,b,y,w,period])=>({min:a*T,max:b*T,x:a*T,y:y*T,w:w*T,h:8,period,dx:0,dy:0}));portals=[{x:66*T,y:7*T-32,w:24,h:32,exit:false}];syncMovers()}
function syncMovers(){for(const m of movingPlatforms){const next=m.min+(m.max-m.min)*(1-Math.cos(tick*Math.PI*2/m.period))/2;m.dx=next-m.x;m.dy=0;m.x=next}}
function activeWidth(){return room==='secret'?W:worldW}
function nearPortal(){return portals.find(p=>Math.abs(player.x+player.w/2-(p.x+p.w/2))<28&&Math.abs(player.y+player.h-(p.y+p.h))<22)}
function enterSecret(){if(room!=='main'||level!==3)return;checkpoint=65*T;checkpointState=snapshot();roomReturn={x:player.x,y:player.y,checkpoint,snapshot:room==='secret'?roomReturn.snapshot:checkpointState};save();room='secret';solids=[];crates=[];enemies=[];particles=[];flags=[];movingPlatforms=[];riding=null;for(let x=0;x<20;x++)block(x,10,1,3,'cave');[[4,9,3],[8,8,3],[12,9,3]].forEach(([x,y,w])=>block(x,y,w,1,'brick'));gems=[5,6,7,9,10,11,13,14].map((x,i)=>({x:x*T+8,y:8*T,got:!!(secretLoot&(1<<i)),secretIndex:i}));powerups=[{x:16*T,y:8*T,type:'heart',got:secretHeart,secret:true}];portals=[{x:2*T,y:10*T-32,w:24,h:32,exit:true}];player.x=3*T;player.y=8*T;player.vx=player.vy=0;player.onGround=false;player.inv=1;cam=0;resetInput();tone(680,.22)}
function commitSecretLoot(){if(room!=='secret'||!roomReturn)return;roomReturn.snapshot={...roomReturn.snapshot,score,coins,secretLoot,secretHeart};checkpointState=roomReturn.snapshot;save()}
function leaveSecret(){if(room!=='secret'||!roomReturn)return;const r=roomReturn;build();restore(r.snapshot);checkpoint=r.checkpoint;checkpointState=snapshot();player.x=r.x;player.y=r.y;player.vx=player.vy=0;player.onGround=false;player.inv=1;riding=null;cam=Math.max(0,Math.min(worldW-W,player.x-W*.38));resetInput();save();tone(500,.18)}
function interact(){if(actionBuffer<=0)return false;const p=nearPortal();if(!p)return false;actionBuffer=0;if(p.exit)leaveSecret();else enterSecret();return true}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function collide(axis){
for(const list of [solids,crates])for(const b of list){
if(!intersects(player,b))continue;
if(axis==='x'){if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0}
else{if(player.vy>0){player.y=b.y-player.h;player.onGround=true}
else if(player.vy<0){player.y=b.y+b.h;if(list===crates&&!b.used){b.used=true;score+=50;gems.push({x:b.x+8,y:b.y-24,got:false});for(let i=0;i<8;i++)particles.push({x:b.x+12,y:b.y+12,vx:(Math.random()-.5)*120,vy:-Math.random()*130,life:.6});tone(650)}}player.vy=0}}
}
function snapshot(){return {score,coins,clock:tick,secretLoot,secretHeart,gems:gems.map(g=>({...g})),crates:crates.map(q=>q.used),powerups:powerups.map(p=>p.got),enemies:enemies.map(e=>({x:e.x,y:e.y,vx:e.vx,alive:e.alive}))}}
function restore(d){if(!d||!Array.isArray(d.gems))return;score=Math.max(0,d.score|0);coins=Math.max(0,d.coins|0);secretLoot=(d.secretLoot|0)&255;secretHeart=!!d.secretHeart;if(Number.isFinite(d.clock))tick=Math.max(0,d.clock);syncMovers();riding=null;gems=d.gems.filter(g=>Number.isFinite(g.x)&&Number.isFinite(g.y)).map(g=>({...g}));crates.forEach((q,i)=>q.used=!!d.crates?.[i]);powerups.forEach((p,i)=>p.got=!!d.powerups?.[i]);enemies.forEach((e,i)=>{const v=d.enemies?.[i];if(v&&Number.isFinite(v.x)&&Number.isFinite(v.vx)){e.x=v.x;if(Number.isFinite(v.y))e.y=v.y;e.vx=v.vx;e.alive=!!v.alive}})}
function hurt(){if(player.inv>0)return;lives--;tone(130,.25);if(lives<=0){state='lost';try{localStorage.removeItem('pq_save')}catch(e){}show('GAME OVER','RETRY');return}if(room==='secret')leaveSecret();restore(checkpointState);player.boost=0;riding=null;player.x=checkpoint;player.y=5*T;player.vx=player.vy=0;player.inv=1.5;save()}
function show(title,button){document.querySelector('#level3').style.display='none';document.querySelector('#level2').style.display='none';overlay.style.display='flex';overlay.querySelector('h1').textContent=title;start.textContent=button;cont.style.display='none';document.querySelector('#home').style.display='block';document.querySelector('#levels').style.display='none';document.querySelector('#settings').style.display='none'}
function begin(resume=false,selected=1){let saved=null;if(resume){try{saved=JSON.parse(readStore('pq_save')||'null')}catch{}}level=resume?Math.max(1,Math.min(3,saved?.level|0)):Math.max(1,Math.min(3,selected|0));build();score=0;coins=0;lives=3;if(resume){try{const d=JSON.parse(readStore('pq_save')||'null');if(d&&Number.isFinite(d.x)&&d.x>=0&&d.x<worldW){player.x=d.x;player.y=5*T;checkpoint=d.x;score=Math.max(0,d.score|0);coins=Math.max(0,d.coins|0);lives=Math.max(1,Math.min(5,d.lives|0));restore(d.snapshot)}}catch(e){}}checkpointState=snapshot();resetInput();cam=Math.max(0,Math.min(worldW-W,player.x-W*.38));state='play';overlay.style.display='none';save();tone(480)}
start.onclick=()=>{if(state==='paused'||state==='between'){state='play';overlay.style.display='none';resetInput()}else begin(false)};cont.onclick=()=>begin(true);cont.style.display=readStore('pq_save')?'block':'none';
function menu(){resetInput();state='menu';show('PIXEL QUEST','NEW GAME');cont.style.display=readStore('pq_save')?'block':'none';document.querySelector('#home').style.display='none';document.querySelector('#levels').style.display='block';document.querySelector('#settings').style.display='block';overlay.querySelector('p').textContent='PIXEL QUEST • 3 playable levels • v'+VERSION}
document.querySelector('#level3').onclick=()=>begin(false,3);document.querySelector('#level2').onclick=()=>begin(false,2);document.querySelector('#home').onclick=menu;document.querySelector('#levels').onclick=()=>{show('LEVEL SELECT','PLAY 1-1');document.querySelector('#level2').style.display='block';document.querySelector('#level3').style.display='block';overlay.querySelector('p').textContent='Emerald Hills · Dusk Trail · Crystal Caverns. Choose a level.'};document.querySelector('#settings').onclick=()=>{sound=!sound;try{localStorage.setItem('pq_sound',sound?'on':'off')}catch{}document.querySelector('#settings').textContent='SOUND: '+(sound?'ON':'OFF');tone(500)};
const sources={left:new Set(),right:new Set(),jump:new Set(),run:new Set(),action:new Set()};
function resetInput(){for(const k of Object.keys(keys)){keys[k]=false;sources[k].clear()}jumpBuffer=0;actionBuffer=0}
function input(k,id,down){if(down)sources[k].add(id);else sources[k].delete(id);setKey(k,sources[k].size>0)}
function setKey(k,v){if((k==='run'||k==='action')&&v&&!keys[k])actionBuffer=.16;if(k==='jump'&&v&&!keys.jump)jumpBuffer=.13;keys[k]=v}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(k,e.pointerId,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>input(k,e.pointerId,false))});
const map={KeyE:'action',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'run',ShiftRight:'run'};
addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();input(map[e.code],e.code,true)}if(e.code==='KeyP'&&!e.repeat)pause()});addEventListener('keyup',e=>{if(map[e.code]){e.preventDefault();input(map[e.code],e.code,false)}});addEventListener('blur',()=>{resetInput();if(state==='play')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
function pause(){resetInput();if(state==='play'){state='paused';show('PAUSED','RESUME')}else if(state==='paused'){state='play';overlay.style.display='none'}}
document.querySelector('#pause').onclick=pause;
function save(){try{localStorage.setItem('pq_save',JSON.stringify({version:VERSION,level,x:checkpoint,score,coins,lives,snapshot:room==='secret'?roomReturn.snapshot:checkpointState}))}catch(e){}}function step(dt){tick+=dt;syncMovers();if(riding&&player.onGround&&player.vy>=0){player.x+=riding.dx;player.y+=riding.dy}riding=null;actionBuffer=Math.max(0,actionBuffer-dt);if(interact())return;elapsed+=dt;player.inv=Math.max(0,player.inv-dt);player.boost=Math.max(0,player.boost-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);coyote=player.onGround?.095:Math.max(0,coyote-dt);
const dir=(keys.right?1:0)-(keys.left?1:0);if(dir)facing=dir;const speed=player.boost>0?240:(keys.run?190:135),acc=player.onGround?1100:700;player.vx+=Math.max(-acc*dt,Math.min(acc*dt,dir*speed-player.vx));if(!dir)player.vx*=Math.max(0,1-(player.onGround?12:3)*dt);
if(jumpBuffer>0&&coyote>0){tone(420);player.vy=-305;player.onGround=false;coyote=0;jumpBuffer=0}
if(!keys.jump&&player.vy<0)player.vy+=1100*dt;
player.vy=Math.min(520,player.vy+850*dt);player.x+=player.vx*dt;collide('x');const previousFeet=player.y+player.h;player.y+=player.vy*dt;player.onGround=false;collide('y');if(player.vy>=0){for(const m of movingPlatforms){if(previousFeet<=m.y+1&&player.y+player.h>=m.y&&player.x+player.w>m.x&&player.x<m.x+m.w){player.y=m.y-player.h;player.vy=0;player.onGround=true;riding=m;break}}}player.x=Math.max(0,Math.min(activeWidth()-player.w,player.x));
if(player.y>H+140){hurt();return}
for(const p of powerups){if(!p.got&&Math.abs(player.x-p.x)<20&&Math.abs(player.y-p.y)<24){p.got=true;if(p.type==='heart')lives=Math.min(5,lives+1);else player.boost=10;score+=250;if(p.secret){secretHeart=true;commitSecretLoot()}}}for(const g of gems){if(!g.got&&Math.abs(player.x-g.x)<19&&Math.abs(player.y-g.y)<23){g.got=true;tone(880);coins++;score+=100;if(g.secretIndex!==undefined){secretLoot|=1<<g.secretIndex;commitSecretLoot()}for(let i=0;i<7;i++)particles.push({x:g.x,y:g.y,vx:(Math.random()-.5)*100,vy:-Math.random()*100,life:.5})}}
for(const e of enemies){if(!e.alive)continue;const oldX=e.x,oldY=e.y;e.x+=e.vx*dt;if(e.type==='bat'){e.y=e.baseY+Math.sin(tick*2+e.phase)*12;if(e.x<e.minX||e.x>e.maxX||solids.some(b=>intersects(e,b))||crates.some(b=>intersects(e,b))){e.x=oldX;e.y=oldY;e.vx=-e.vx}}else{const probe={x:e.vx>0?e.x+e.w+1:e.x-2,y:e.y+e.h+2,w:2,h:3};if(solids.some(b=>intersects(e,b))||!solids.some(b=>intersects(probe,b))){e.x=oldX;e.vx=-e.vx}}if(intersects(player,e)){if(player.vy>40&&player.y+player.h-e.y<15){e.alive=false;tone(220);player.vy=-220;score+=200;for(let i=0;i<8;i++)particles.push({x:e.x+10,y:e.y+6,vx:(Math.random()-.5)*90,vy:-Math.random()*80,life:.4})}else if(player.inv<=0){hurt();return}}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(room==='main'&&player.x>63*T&&checkpoint<60*T){checkpoint=60*T;checkpointState=snapshot();tone(720,.18);save()}if(room==='main'&&player.x>105*T&&checkpoint<95*T){checkpoint=95*T;checkpointState=snapshot();tone(720,.18);save()}
if(state==='play'&&room==='main'&&player.x>flags[0].x-10){if(level<3){const finished=level;level++;build();checkpointState=snapshot();save();resetInput();show('LEVEL '+finished+' COMPLETE!','NEXT LEVEL');state='between';return}state='won';try{localStorage.removeItem('pq_save')}catch(e){}try{localStorage.setItem('pq_unlocked','1');localStorage.setItem('pq_score',score);localStorage.setItem('pq_coins',coins)}catch{}tone(960,.3);show('CAVERNS COMPLETE!','PLAY AGAIN')}
cam+=((Math.max(0,Math.min(activeWidth()-W,player.x-W*.38)))-cam)*Math.min(1,dt*7);hud.textContent='★ '+score+'   ◆ '+coins+'   ♥ '+lives+'   1-'+level+'   v'+VERSION+(room==='secret'?'   SECRET':nearPortal()?'   ⚡ / E: '+(nearPortal().exit?'EXIT':'ENTER'):'')}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
